[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joncanturk-pentestlab"
version = "0.2.0"
description = "Small security lab tools with structured observations and offline reporting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pcap = ["scapy>=2.6,<3"]
desktop = ["wxPython>=4.2,<5"]

[project.scripts]
pentestlab = "pentestlab.cli:main"

[tool.setuptools]
packages = ["pentestlab"]
py-modules = ["nmapscanner", "inforecon", "hiddenwifi", "floodz", "md5crack", "macspoofpy", "new_mac", "server", "grabber"]
