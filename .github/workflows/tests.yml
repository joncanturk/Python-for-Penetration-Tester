name: Python checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[pcap]"
      - run: python -m unittest discover -s tests -v
      - run: python nmapscanner.py --xml examples/nmap.xml
      - run: python md5crack.py -md5 5d41402abc4b2a76b9719d911017c592 -w examples/words.txt
      - name: Installed CLI outside the source tree
        working-directory: ${{ runner.temp }}
        run: pentestlab --version
      - name: Unified offline pipeline
        run: |
          pentestlab scan --xml examples/nmap.xml --output scan.json
          pentestlab report scan.json --format markdown --output report.md
